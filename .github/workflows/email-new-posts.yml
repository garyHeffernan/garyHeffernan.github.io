name: Email new posts

# Runs after a publish touches the feed. send_email.py compares docs/feed.xml
# against sent.json and creates a Buttondown email for anything new.
#
# Before the first real run, seed the ledger so the archive does not go out:
#   python3 send_email.py --seed && git add sent.json && git commit && git push
#
# The workflow needs one repository secret: BUTTONDOWN_API_KEY.

on:
  push:
    branches: [main]
    paths:
      - 'docs/feed.xml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create the emails
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python3 send_email.py

      - name: Record what went out
        run: |
          if [[ -n "$(git status --porcelain sent.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent.json
            git commit -m "Record emailed posts"
            git push
          fi
